events {
    worker_connections 1024;
}

http {
    upstream evolution_api {
        server evolution-api:8080;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=messages:10m rate=5r/s;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    server {
        listen 80;
        server_name localhost;

        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";

        # API routes
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://evolution_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Message routes with stricter rate limiting
        location ~ ^/api/message/.*/(text|image|video|audio|document)$ {
            limit_req zone=messages burst=10 nodelay;
            
            proxy_pass http://evolution_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health checks
        location /health {
            proxy_pass http://evolution_api;
            access_log off;
        }

        location /ready {
            proxy_pass http://evolution_api;
            access_log off;
        }

        location /live {
            proxy_pass http://evolution_api;
            access_log off;
        }

        # Metrics (optional - restrict access)
        location /metrics {
            # Uncomment to restrict access to specific IPs
            # allow 127.0.0.1;
            # allow 10.0.0.0/8;
            # deny all;
            
            proxy_pass http://evolution_api;
        }

        # Default location
        location / {
            return 404;
        }
    }
}
