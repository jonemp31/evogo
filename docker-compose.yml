version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: evolution-postgres
    environment:
      POSTGRES_DB: evolution_api
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - evolution-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: evolution-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - evolution-network
    restart: unless-stopped

  # Evolution API Go
  evolution-api:
    build: .
    container_name: evolution-api-go
    environment:
      # Server Configuration
      SERVER_PORT: 8080
      SERVER_HOST: 0.0.0.0
      SERVER_URL: http://localhost:8080
      
      # Database Configuration
      DATABASE_URL: postgres://evolution:evolution123@postgres:5432/evolution_api?sslmode=disable
      DATABASE_PROVIDER: postgresql
      
      # Redis Configuration
      REDIS_URL: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      
      # API Configuration
      API_KEY: your-secret-api-key-here
      DEBUG_MODE: true
      
      # Webhook Configuration
      WEBHOOK_TIMEOUT: 30
      WEBHOOK_RETRY_ATTEMPTS: 3
      
      # Instance Configuration
      INSTANCE_CLEANUP_INTERVAL: 300
      INSTANCE_MAX_IDLE_TIME: 3600
      
      # Logging Configuration
      LOG_LEVEL: info
      LOG_FORMAT: json
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    networks:
      - evolution-network
    restart: unless-stopped
    volumes:
      - ./data:/root/data  # For WhatsApp session storage

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: evolution-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - evolution-api
    networks:
      - evolution-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  evolution-network:
    driver: bridge
